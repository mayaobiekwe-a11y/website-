<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face{ font-family:"Fraunces"; font-weight:600; src:url("fonts/fraunces-600.woff2") format("woff2"); }
  @font-face{ font-family:"Inter"; font-weight:700; src:url("fonts/inter-700.woff2") format("woff2"); }
  :root{
    --forest:#20301F; --forest-dark:#141E13; --cream:#F5F1E6;
    --blush:#DDBBAE; --gold:#C7C05E; --oxblood:#5C2331;
    --font-display:"Fraunces", Georgia, serif;
    --font-body:"Inter", -apple-system, "Segoe UI", sans-serif;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:1080px; height:1350px; }
  body{
    background: var(--forest-dark);
    font-family: var(--font-body);
    color: var(--cream);
    position: relative;
    overflow: hidden;
  }
  .mark{ position:absolute; top:44px; left:52px; font-family:var(--font-display); font-weight:600; font-size:22px; color:var(--cream); z-index:5; }
  .mark span{ color:var(--gold); }
  .counter{ position:absolute; top:48px; right:52px; font-weight:700; font-size:15px; letter-spacing:0.08em; color:var(--blush); z-index:5; }

  .wrap{
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 70px;
  }
  .frame{
    width: 560px;
    height: 560px;
    border-radius: 20px;
    border: 6px solid var(--gold);
    overflow: hidden;
    box-shadow: 0 30px 50px rgba(0,0,0,0.4);
  }
  .frame img{
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 20%;
  }
  .text{ text-align: center; margin-top: 40px; }
  .eyebrow{ font-weight:700; font-size:14px; letter-spacing:0.2em; text-transform:uppercase; color:var(--gold); }
  .name{ font-weight:700; font-size:46px; line-height:1.1; color:var(--cream); margin-top:12px; }
  .title{ font-weight:700; font-size:22px; color:var(--gold); margin-top:8px; }
  .divider{ width:60px; height:4px; background:var(--gold); margin:18px auto; }
  .tagline{ font-family:var(--font-display); font-style:italic; font-weight:500; font-size:21px; color:var(--blush); max-width:620px; margin:0 auto; }
</style>
</head>
<body>
  <div class="mark">BW<span>R</span></div>
  <div class="counter">6 / 6</div>

  <div class="wrap">
    <div class="frame"><img src="photos/james-official-crop.png" alt=""></div>
    <div class="text">
      <div class="eyebrow">Three Terms Strong</div>
      <div class="name">Letitia James</div>
      <div class="title">New York Attorney General</div>
      <div class="divider"></div>
      <div class="tagline">Won reelection to a third term as Attorney General.</div>
    </div>
  </div>
</body>
</html>
